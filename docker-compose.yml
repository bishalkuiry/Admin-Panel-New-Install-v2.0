services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-inallcart-app}:latest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - inallcart

  webserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - app
    networks:
      - inallcart

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-quixko_db}
      MYSQL_USER: ${DB_USERNAME:-quixko}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - inallcart_dbdata:/var/lib/mysql
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USERNAME:-quixko}", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - inallcart

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - inallcart_redisdata:/data
    networks:
      - inallcart

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-inallcart-app}:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      APP_ROLE: worker
    depends_on:
      - app
      - db
      - redis
    networks:
      - inallcart

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-inallcart-app}:latest
    restart: unless-stopped
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    working_dir: /var/www/html
    volumes:
      - ./.env:/var/www/html/.env
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
      APP_ROLE: worker
    depends_on:
      - app
      - db
      - redis
    networks:
      - inallcart

networks:
  inallcart:
    driver: bridge

volumes:
  inallcart_dbdata:
  inallcart_redisdata:
